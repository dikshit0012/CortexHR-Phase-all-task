# Task 18 - scheduled drift + fairness monitoring.
# Schedule: every day at 02:00 UTC. GitHub does not allow variables inside `on.schedule`, so to change the schedule edit the single
# `cron:` line below (or run it on demand with "Run workflow"). Results are kept as the artifact "monitoring-results".
#
# Private data is NEVER committed. CORTEXHR_MONITORING_DATA_URL (a direct, signed HTTPS URL to a ZIP) and
# CORTEXHR_MONITORING_DATA_SHA256 are required repository secrets. Missing or invalid input still produces a
# NOT_EVALUATED report and a failing job; it can never be made green with fail_on=never.
name: model-monitoring

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      fail_on:
        description: "Fail on measured alerts (or watch); missing required evidence always fails."
        type: choice
        options: [alert, watch, never]
        default: alert

permissions:
  contents: read
  actions: read          # to download the previous run's results so monitoring_history.csv keeps accumulating

concurrency:
  group: model-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: phase-4/task18
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: phase-4/task18/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous monitoring history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download --repo "$GITHUB_REPOSITORY" --name monitoring-results --dir outputs/monitoring

      - name: Fetch private monitoring data (never committed)
        continue-on-error: true
        env:
          DATA_URL: ${{ secrets.CORTEXHR_MONITORING_DATA_URL }}
          DATA_SHA256: ${{ secrets.CORTEXHR_MONITORING_DATA_SHA256 }}
        run: |
          python download_monitoring_data.py --data-dir "$RUNNER_TEMP/cortexhr-data-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Run monitoring
        run: python monitor.py --fail-on "${{ inputs.fail_on || 'alert' }}"

      - name: Publish to the deployed API and verify it
        if: always()
        env:
          CORTEXHR_API_URL: ${{ secrets.CORTEXHR_API_URL }}
          CORTEXHR_API_KEY: ${{ secrets.CORTEXHR_API_KEY }}
          CORTEXHR_MONITORING_PUBLISH_KEY: ${{ secrets.CORTEXHR_MONITORING_PUBLISH_KEY }}
        run: |
          if [ -z "$CORTEXHR_API_URL" ] || [ -z "$CORTEXHR_MONITORING_PUBLISH_KEY" ] || [ -z "$CORTEXHR_API_KEY" ]; then
            echo "::warning::CORTEXHR_API_URL / CORTEXHR_API_KEY / CORTEXHR_MONITORING_PUBLISH_KEY secrets are not all set; the report was NOT published to the API."
            exit 0
          fi
          [ -f outputs/monitoring/latest_report.json ] || { echo "::error::no report to publish"; exit 1; }
          python verify_live.py --publish

      - name: Annotate WATCH
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p = "outputs/monitoring/latest_report.json"
          if os.path.exists(p) and json.load(open(p)).get("status") == "WATCH":
              print("::warning::Model monitoring status is WATCH - see the job summary")
          PY

      - name: Job summary
        if: always()
        run: '[ -f outputs/monitoring/latest_report.md ] && cat outputs/monitoring/latest_report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report was produced." >> "$GITHUB_STEP_SUMMARY"'

      - name: Upload monitoring results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-results
          path: phase-4/task18/outputs/monitoring/
          if-no-files-found: error
          retention-days: 90
