[pytest]
testpaths = tests
filterwarnings =
    ignore::sklearn.exceptions.InconsistentVersionWarning
    ignore::DeprecationWarning
markers =
    real_model: runs the real saved artifacts / real Task 11-16 code (integration test)
    mocked: unit test with a stand-in registry (no model inference)
    needs_workbook: needs the private reference workbook (CORTEXHR_WORKBOOK); skipped when it is not provided
